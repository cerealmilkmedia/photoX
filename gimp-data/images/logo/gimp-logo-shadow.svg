<?xml version="1.0" encoding="UTF-8"?>
<!-- PhotoX logo: a bold "P" with an X-shaped sparkle on a gradient tile (with drop shadow, used in the About dialog). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.55" stop-color="#E23C8A"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)"><rect x="16" y="12" width="224" height="224" rx="52" fill="url(#bg)"/></g>
  <g transform="translate(128 124) scale(0.93) translate(-128 -128)">
    <path d="M96 76 V184 M96 76 H140 A36 36 0 0 1 140 148 H96" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M180 150 Q184 174 206 178 Q184 182 180 206 Q176 182 154 178 Q176 174 180 150 Z" fill="#ffffff"/>
  </g>
</svg>
